[supervisord]
nodaemon=true
user=root

[program:xvfb]
command=Xvfb :1 -screen 0 1600x900x24
autorestart=true
priority=100

[program:fluxbox]
command=fluxbox -display :1
autorestart=true
priority=200

[program:x11vnc]
command=x11vnc -display :1 -nopw -listen 0.0.0.0 -xkb -ncache 10 -ncache_cr -forever -shared -rfbport 5901
autorestart=true
priority=300

[program:novnc]
command=/usr/share/novnc/utils/launch.sh --vnc localhost:5901 --listen 6080
autorestart=true
priority=400

[program:agentgrid]
command=/usr/local/bin/agentgrid-runner
autorestart=false
startsecs=5
priority=500
